<!-- templates/partials/sac-widget.html -->
<div id="sac-widget" class="sac-widget-container">
  <button id="sac-open-btn" class="btn btn-primary sac-widget-toggle" type="button">
    <i class="bi bi-chat-dots"></i>
    <span class="ms-1 d-none d-md-inline">¿Necesitas ayuda?</span>
  </button>

  <div id="sac-chat-panel" class="sac-chat-panel card shadow d-none">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div>
        <strong>Asistente Hotel Villa Grace</strong><br>
        <small class="text-muted">Chatbot + equipo de recepción</small>
      </div>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="sac-close-btn">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <div class="card-body p-2">
      <div id="sac-messages" class="sac-messages">
        <!-- Mensajes dinámicos -->
      </div>

      <!-- Zona para oferta de traspaso a agente -->
      <div id="sac-handoff-box" class="alert alert-warning py-2 px-3 mt-2 mb-2 d-none">
        <div class="small mb-2">
          ¿Desea que un agente humano de recepción continúe la atención?
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm btn-primary" id="sac-handoff-yes">
            Sí, hablar con un agente
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary" id="sac-handoff-no">
            No, gracias
          </button>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <form id="sac-chat-form" class="d-flex gap-2">
        <input type="text" id="sac-input" class="form-control" autocomplete="off"
               placeholder="Escribe tu consulta...">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-send"></i>
        </button>
      </form>
    </div>
  </div>
</div>

<style>
  .sac-widget-container {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 1050;
  }

  .sac-widget-toggle {
    border-radius: 999px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .25);
  }

  .sac-chat-panel {
    position: absolute;
    right: 0;
    bottom: 60px;
    width: min(420px, calc(100vw - 24px));
    height: min(680px, calc(100vh - 90px));
    border-radius: 16px;
    overflow: hidden;
  }

  .sac-chat-panel.card {
    display: flex;
    flex-direction: column;
  }

  .sac-chat-panel .card-header {
    flex: 0 0 auto;
  }

  .sac-chat-panel .card-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px !important;
  }

  .sac-chat-panel .card-footer {
    flex: 0 0 auto;
    background: #fff;
  }

  .sac-messages {
    flex: 1 1 auto;
    min-height: 220px;
    overflow-y: auto;
    background: #f8f9fa;
    padding: 8px;
    border-radius: 10px;
  }

  .sac-msg-row {
    display: flex;
    margin-bottom: 10px;
  }

  .sac-msg-row.user {
    justify-content: flex-end;
  }

  .sac-msg-row.bot {
    justify-content: flex-start;
  }

  .sac-msg-col {
    display: flex;
    flex-direction: column;
    max-width: 88%;
  }

  .sac-msg-row.user .sac-msg-col {
    align-items: flex-end;
    margin-left: auto;
  }

  .sac-msg-author {
    font-size: 0.72rem;
    color: #6c757d;
    margin-bottom: 3px;
    font-weight: 600;
  }

  .sac-msg-row.user .sac-msg-author {
    text-align: right;
  }

  .sac-msg-bubble {
    border-radius: 12px;
    padding: 8px 11px;
    max-width: 100%;
    font-size: 0.92rem;
    word-wrap: break-word;
    white-space: pre-wrap;
    line-height: 1.38;
  }

  .sac-msg-bubble.user {
    background: #0d6efd;
    color: #fff;
  }

  .sac-msg-bubble.bot {
    background: #ffffff;
    border: 1px solid #dee2e6;
  }

  .sac-msg-meta {
    font-size: 0.7rem;
    color: #6c757d;
    margin-top: 3px;
  }

  .sac-handoff-box {
    flex: 0 0 auto;
    margin: 0 !important;
    border-radius: 14px;
  }

  .sac-handoff-box .d-flex {
    flex-wrap: wrap;
  }

  .sac-handoff-box .btn {
    white-space: normal;
  }

  @media (max-width: 575.98px) {
    .sac-widget-container {
      right: 8px;
      left: 8px;
      bottom: 8px;
    }

    .sac-chat-panel {
      width: auto;
      right: 0;
      left: 0;
      bottom: 56px;
      height: min(78vh, 720px);
    }
  }
</style>

<script>
  window.__VG_SAC_WIDGET_V2__ = true;

  window.addEventListener('DOMContentLoaded', function () {
    const widget      = document.getElementById('sac-widget');
    if (!widget) return;

    const openBtn     = document.getElementById('sac-open-btn');
    const panel       = document.getElementById('sac-chat-panel');
    const closeBtn    = document.getElementById('sac-close-btn');
    const messagesBox = document.getElementById('sac-messages');
    const form        = document.getElementById('sac-chat-form');
    const input       = document.getElementById('sac-input');
    const handoffBox  = document.getElementById('sac-handoff-box');
    const handoffYes  = document.getElementById('sac-handoff-yes');
    const handoffNo   = document.getElementById('sac-handoff-no');

    if (!openBtn || !panel || !closeBtn || !messagesBox || !form || !input || !handoffBox) {
      console.warn('[SAC] Widget no inicializado: faltan elementos del DOM.');
      return;
    }

    let sid = localStorage.getItem('sac_sid');
    if (!sid) {
      sid = 'sac-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      localStorage.setItem('sac_sid', sid);
    }

    let lastMessageId = 0;
    let polling = false;
    let pollTimer = null;
    let syncInFlight = false;
    let sendInFlight = false;
    let welcomeInjected = false;

    const seenIds = new Set();

    function formatTime(raw) {
      if (!raw) return '';
      try {
        const str = String(raw);
        const parts = str.split(' ');
        if (parts.length < 2) return '';
        return parts[1].slice(0, 5);
      } catch (_) {
        return '';
      }
    }

    function senderLabel(role, senderName) {
      if (senderName && String(senderName).trim()) {
        return String(senderName).trim();
      }

      const r = String(role || '').toLowerCase();
      if (r === 'user') return 'Cliente';
      if (r === 'agent') return 'Asesor Hotel Villa Grace';
      return 'Bot Hotel Villa Grace';
    }

    function appendMessage(role, text, createdAt, senderName, id) {
      if (!text) return;

      const msgId = (id !== undefined && id !== null) ? String(id) : null;
      if (msgId && seenIds.has(msgId)) return;
      if (msgId) seenIds.add(msgId);

      const normalizedRole = String(role || 'bot').toLowerCase();
      const isUser = normalizedRole === 'user';

      const row = document.createElement('div');
      row.className = 'sac-msg-row ' + (isUser ? 'user' : 'bot');

      const col = document.createElement('div');
      col.className = 'sac-msg-col';

      const author = document.createElement('div');
      author.className = 'sac-msg-author';
      author.textContent = senderLabel(normalizedRole, senderName);

      const bubble = document.createElement('div');
      bubble.className = 'sac-msg-bubble ' + (isUser ? 'user' : 'bot');
      bubble.textContent = text;

      const meta = document.createElement('div');
      meta.className = 'sac-msg-meta';
      const timeStr = formatTime(createdAt);
      meta.textContent = timeStr || '';

      col.appendChild(author);
      col.appendChild(bubble);
      if (timeStr) {
        col.appendChild(meta);
      }

      row.appendChild(col);
      messagesBox.appendChild(row);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function showHandoffOffer() {
      handoffBox.classList.remove('d-none');
    }

    function hideHandoffOffer() {
      handoffBox.classList.add('d-none');
    }

    function setFormDisabled(disabled) {
      input.disabled = disabled;
      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = disabled;
    }

    function setHandoffButtonsDisabled(disabled) {
      if (handoffYes) handoffYes.disabled = disabled;
      if (handoffNo) handoffNo.disabled = disabled;
    }

    async function syncHistory(initial = false) {
      if (syncInFlight) return;
      syncInFlight = true;

      try {
        const params = new URLSearchParams();
        params.set('session_id', sid);

        if (!initial && lastMessageId > 0) {
          params.set('since_id', String(lastMessageId));
        }

        const resp = await fetch('/sac/chat/history?' + params.toString(), {
          method: 'GET',
          headers: { 'X-Session-Id': sid },
          cache: 'no-store'
        });

        if (!resp.ok) {
          throw new Error('HTTP ' + resp.status);
        }

        const data = await resp.json();
        if (!data.ok) return;

        const status = String(data.status || '').toLowerCase();
        const handoffState = String(data.handoff_state || '').toUpperCase();

        if (handoffState === 'OFFER' || status === 'handoff_offer' || data.show_handoff_offer === true) {
          showHandoffOffer();
        } else {
          hideHandoffOffer();
        }

        const msgs = data.messages || [];
        for (const m of msgs) {
          appendMessage(
            m.role || 'bot',
            m.text || '',
            m.created_at || '',
            m.sender_name || '',
            m.id
          );

          const numericId = Number(m.id || 0);
          if (numericId > lastMessageId) {
            lastMessageId = numericId;
          }
        }

        const apiLastMessageId = Number(data.last_message_id || 0);
        if (apiLastMessageId > lastMessageId) {
          lastMessageId = apiLastMessageId;
        }
      } catch (err) {
        console.error('[SAC] Error al sincronizar historial:', err);
      } finally {
        syncInFlight = false;
      }
    }

    async function ask(question) {
      const q = (question || input.value || '').trim();
      if (!q || sendInFlight) return;

      sendInFlight = true;
      setFormDisabled(true);

      try {
        const resp = await fetch('/sac/ask', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Session-Id': sid
          },
          body: JSON.stringify({ q: q })
        });

        if (!resp.ok) {
          throw new Error('HTTP ' + resp.status);
        }

        const data = await resp.json();
        if (!data.ok) {
          throw new Error(data.error || 'Error al consultar /sac/ask');
        }

        input.value = '';

        await syncHistory(false);

        const handoffState = String(data.handoff_state || '').toUpperCase();
        if (handoffState === 'OFFER') {
          showHandoffOffer();
        } else if (handoffState === 'PENDING') {
          hideHandoffOffer();
        }
      } catch (err) {
        console.error('[SAC] Error en /sac/ask:', err);
        appendMessage(
          'bot',
          'Lo siento, no pude comunicarme con el servidor en este momento.',
          '',
          'Bot Hotel Villa Grace',
          'local-error-' + Date.now()
        );
      } finally {
        setFormDisabled(false);
        sendInFlight = false;
        input.focus();
      }
    }

    async function resolveHandoff(decision) {
      if (!decision) return;

      setHandoffButtonsDisabled(true);

      try {
        const resp = await fetch('/sac/chat/handoff-decision', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Session-Id': sid
          },
          body: JSON.stringify({
            session_id: sid,
            decision: decision
          })
        });

        if (!resp.ok) {
          throw new Error('HTTP ' + resp.status);
        }

        const data = await resp.json();
        if (!data.ok) {
          throw new Error(data.error || 'No se pudo procesar la decisión.');
        }

        if (decision === 'accept') {
          hideHandoffOffer();
        } else if (decision === 'reject') {
          hideHandoffOffer();
        }

        await syncHistory(false);
      } catch (err) {
        console.error('[SAC] Error al resolver handoff:', err);
        appendMessage(
          'bot',
          'No se pudo procesar tu decisión en este momento. Inténtalo de nuevo.',
          '',
          'Bot Hotel Villa Grace',
          'local-handoff-error-' + Date.now()
        );
      } finally {
        setHandoffButtonsDisabled(false);
      }
    }

    function startPolling() {
      if (polling) return;
      polling = true;

      pollTimer = setInterval(function () {
        syncHistory(false);
      }, 2500);
    }

    function openPanel() {
      panel.classList.remove('d-none');
      input.focus();
    }

    function closePanel() {
      panel.classList.add('d-none');
    }

    openBtn.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      ask();
    });

    if (handoffYes) {
      handoffYes.addEventListener('click', function () {
        resolveHandoff('accept');
      });
    }

    if (handoffNo) {
      handoffNo.addEventListener('click', function () {
        resolveHandoff('reject');
      });
    }

    syncHistory(true).then(function () {
      if (!messagesBox.children.length && !welcomeInjected) {
        appendMessage(
          'bot',
          'Hola, soy el asistente virtual de Hotel Villa Grace. Cuéntame en qué puedo ayudarte.',
          '',
          'Bot Hotel Villa Grace',
          'virtual-welcome'
        );
        welcomeInjected = true;
      }
      startPolling();
    });
  });
</script>
