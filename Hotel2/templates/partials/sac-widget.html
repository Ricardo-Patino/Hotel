<!-- templates/partials/sac-widget.html -->
<div id="sac-widget" class="sac-widget-container">
  <button id="sac-open-btn" class="btn btn-primary sac-widget-toggle" type="button">
    <i class="bi bi-chat-dots"></i>
    <span class="ms-1 d-none d-md-inline">¿Necesitas ayuda?</span>
  </button>

  <div id="sac-chat-panel" class="sac-chat-panel card shadow d-none">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div>
        <strong>Asistente Hotel Villa Grace</strong><br>
        <small class="text-muted">Chatbot + equipo de recepción</small>
      </div>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="sac-close-btn">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <div class="card-body p-2">
      <div id="sac-messages" class="sac-messages">
        <!-- Mensajes dinámicos -->
      </div>

      <!-- Zona para oferta de traspaso a agente -->
      <div id="sac-handoff-box" class="alert alert-warning py-2 px-3 mt-2 mb-2 d-none">
        <div class="small mb-2">
          ¿Desea que un agente humano de recepción continúe la atención?
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm btn-primary" id="sac-handoff-yes">
            Sí, hablar con un agente
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary" id="sac-handoff-no">
            No, gracias
          </button>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <form id="sac-chat-form" class="d-flex gap-2">
        <input type="text" id="sac-input" class="form-control" autocomplete="off"
               placeholder="Escribe tu consulta...">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-send"></i>
        </button>
      </form>
    </div>
  </div>
</div>

<style>
  .sac-widget-container {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 1050;
  }
  .sac-widget-toggle {
    border-radius: 999px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }
  .sac-chat-panel {
    position: absolute;
    right: 0;
    bottom: 60px;
    width: 320px;
    max-height: 520px;
    border-radius: 12px;
    overflow: hidden;
  }
  .sac-messages {
    max-height: 360px;
    overflow-y: auto;
    background:#f8f9fa;
    padding: 6px;
    border-radius: 8px;
  }
  .sac-msg-row {
    display:flex;
    margin-bottom: 6px;
  }
  .sac-msg-row.user { justify-content: flex-end; }
  .sac-msg-row.bot  { justify-content: flex-start; }
  .sac-msg-bubble {
    border-radius: 12px;
    padding: 6px 10px;
    max-width: 80%;
    font-size: 0.9rem;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .sac-msg-bubble.user {
    background:#0d6efd;
    color:#fff;
  }
  .sac-msg-bubble.bot {
    background:#ffffff;
    border:1px solid #dee2e6;
  }
  .sac-msg-meta {
    font-size:0.7rem;
    color:#6c757d;
    margin-top:2px;
  }

  @media (max-width: 575.98px) {
    .sac-chat-panel {
      width: 100vw;
      right: 0;
      bottom: 56px;
    }
  }
</style>

<script>
  window.addEventListener('DOMContentLoaded', function () {
    const widget      = document.getElementById('sac-widget');
    if (!widget) {
      console.warn('[SAC] No se encontró #sac-widget en el DOM.');
      return;
    }

    const openBtn     = document.getElementById('sac-open-btn');
    const panel       = document.getElementById('sac-chat-panel');
    const closeBtn    = document.getElementById('sac-close-btn');
    const messagesBox = document.getElementById('sac-messages');
    const form        = document.getElementById('sac-chat-form');
    const input       = document.getElementById('sac-input');
    const handoffBox  = document.getElementById('sac-handoff-box');
    const handoffYes  = document.getElementById('sac-handoff-yes');
    const handoffNo   = document.getElementById('sac-handoff-no');

    if (!openBtn || !panel || !closeBtn || !messagesBox || !form || !input) {
      console.warn('[SAC] Widget no inicializado: faltan elementos clave en la plantilla.');
      return;
    }

    console.log('[SAC] Widget SAC inicializado correctamente.');

    // --- Sesión persistente por visitante ---
    let sid = localStorage.getItem('sac_sid');
    if (!sid) {
      sid = 'sac-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      localStorage.setItem('sac_sid', sid);
    }

    // --- Estado de conversación / polling ---
    let lastMsgAt = null;      // string ISO del último mensaje
    let pollTimer = null;
    let polling   = false;
    let convId    = null;
    const seenIds = new Set(); // ids ya pintados

    function formatTime(ts) {
      if (!ts) return '';
      try {
        const parts = ts.split(' ');
        if (parts.length !== 2) return '';
        return parts[1].slice(0,5); // HH:MM
      } catch (_) {
        return '';
      }
    }

    function appendMessage(role, text, createdAt) {
      if (!text) return;

      const isUser  = (role === 'user');
      const isAgent = (role === 'agent');

      const row = document.createElement('div');
      row.classList.add('sac-msg-row');
      row.classList.add(isUser ? 'user' : 'bot');

      const col = document.createElement('div');

      const bubble = document.createElement('div');
      bubble.classList.add('sac-msg-bubble');
      bubble.classList.add(isUser ? 'user' : 'bot');
      bubble.textContent = text;

      const meta = document.createElement('div');
      meta.classList.add('sac-msg-meta');

      let label = '';
      if (isUser) {
        label = 'Tú';
      } else if (isAgent) {
        label = 'Agente de recepción';
      } else {
        label = 'Asistente Hotel Villa Grace';
      }

      const timeStr = formatTime(createdAt);
      meta.textContent = timeStr ? (label + ' · ' + timeStr) : label;

      col.appendChild(bubble);
      col.appendChild(meta);
      row.appendChild(col);

      messagesBox.appendChild(row);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function showHandoffOffer() {
      if (handoffBox) {
        handoffBox.classList.remove('d-none');
      }
    }

    function hideHandoffOffer() {
      if (handoffBox) {
        handoffBox.classList.add('d-none');
      }
    }

    // --- Historial completo / incremental ---
    async function syncHistoryOnce(initial) {
      try {
        const params = new URLSearchParams();
        params.set('session_id', sid);
        if (!initial && lastMsgAt) {
          params.set('since', lastMsgAt);
        }

        const resp = await fetch('/sac/chat/history?' + params.toString(), {
          method: 'GET',
          headers: {
            'X-Session-Id': sid
          }
        });

        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        if (!data.ok) return;

        if (data.conv_id) {
          convId = data.conv_id;
        }

        const statusRaw = data.status || '';
        const status = String(statusRaw || '').toLowerCase();
        const abierta = (typeof data.abierta === 'undefined') ? true : !!data.abierta;

        if (abierta && status === 'handoff_offer') {
          showHandoffOffer();
        } else {
          hideHandoffOffer();
        }

        const msgs = data.messages || [];
        for (const m of msgs) {
          const id        = m.id;
          const role      = m.role || 'bot';   // 'user' | 'bot' | 'agent'
          const text      = m.text || '';
          const createdAt = m.created_at || null;

          if (id && seenIds.has(id)) {
            continue; // ya pintado
          }

          appendMessage(role, text, createdAt);

          if (id) {
            seenIds.add(id);
          }
          if (createdAt) {
            if (!lastMsgAt || createdAt > lastMsgAt) {
              lastMsgAt = createdAt;
            }
          }
        }

        if (data.last_msg_at && (!lastMsgAt || data.last_msg_at > lastMsgAt)) {
          lastMsgAt = data.last_msg_at;
        }
      } catch (err) {
        console.error('[SAC] Error al sincronizar historial', err);
      }
    }

    function startPolling() {
      if (polling) return;
      polling = true;
      pollTimer = setInterval(function () {
        syncHistoryOnce(false);
      }, 4000);
    }

    function stopPolling() {
      polling = false;
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    // --- Llamada principal al bot (IA / RAG) ---
    async function ask(question) {
      const q = (question || input.value || '').trim();
      if (!q) return;

      appendMessage('user', q, null);
      input.value = '';

      try {
        const resp = await fetch('/sac/ask', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Session-Id': sid
          },
          body: JSON.stringify({ q: q })
        });

        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();

        if (data.need_handoff) {
          if (data.handoff_state === 'OFFER') {
            showHandoffOffer();
          } else {
            hideHandoffOffer();
          }
        } else {
          hideHandoffOffer();
        }

        // Sincronizamos para traer la respuesta real desde la BD
        await syncHistoryOnce(false);
      } catch (err) {
        console.error('[SAC] Error en /sac/ask', err);
        appendMessage(
          'bot',
          'Lo siento, no pude contactar al servidor en este momento.',
          null
        );
      }
    }

    // --- Escalar explícitamente a agente humano ---
    async function escalarHumano() {
      try {
        const resp = await fetch('/sac/chat/escalar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Session-Id': sid
          },
          body: JSON.stringify({
            session_id: sid,
            texto: 'El cliente ha solicitado ser atendido por un agente humano.'
          })
        });

        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();

        appendMessage(
          'bot',
          data.mensaje || 'Tu consulta ha sido enviada a un agente humano de recepción. En breve continuarán la atención por este mismo chat.',
          null
        );

        hideHandoffOffer();
        await syncHistoryOnce(false);
      } catch (err) {
        console.error('[SAC] Error en /sac/chat/escalar', err);
        appendMessage(
          'bot',
          'No pude contactar al sistema de recepción en este momento. Por favor llámanos al +506 2642 0225 para ayudarte.',
          null
        );
      }
    }

    // --- Manejo de panel ---
    function openPanel() {
      panel.classList.remove('d-none');
      if (!polling) {
        syncHistoryOnce(true).then(startPolling);
      }
    }

    function closePanel() {
      panel.classList.add('d-none');
      // Si quisieras detener el polling al cerrar, descomenta:
      // stopPolling();
    }

    // --- Listeners UI ---
    openBtn.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      ask();
    });

    if (handoffYes) {
      handoffYes.addEventListener('click', function () {
        escalarHumano();
      });
    }

    if (handoffNo) {
      handoffNo.addEventListener('click', function () {
        hideHandoffOffer();
        // Opcional: podríamos enviar un mensaje corto al bot indicando que no
        // desea escalar, para que el estado pase de handoff_offer → bot.
        // ask('No, gracias');
      });
    }

    // Cargar historial y empezar polling incluso si el panel está cerrado,
    // de forma que al abrirlo ya esté la conversación lista.
    syncHistoryOnce(true).then(startPolling);
  });
</script>
