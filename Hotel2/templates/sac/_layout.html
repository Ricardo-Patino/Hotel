{% extends "base.html" %}

{% block body_class %}sac-page{% endblock %}

{% block content %}

<div class="page-title dark-background" data-aos="fade"
  style="background-image: url('{{ url_for('static', filename='assets/img/hotel/showcase-7.webp') }}');">
  <div class="container position-relative">
    <h1>{% block page_h1 %}Atención al Cliente{% endblock %}</h1>
    <nav class="breadcrumbs" aria-label="breadcrumbs">
      <ol>
        <li><a href="{{ url_for('index_html') }}">Inicio</a></li>
        <li class="current">{% block crumb %}Atención{% endblock %}</li>
      </ol>
    </nav>
  </div>
</div>

<section class="section" data-aos="fade-up">
  <div class="container">
    {% block sac_content %}{% endblock %}
  </div>
</section>

{% endblock %}
