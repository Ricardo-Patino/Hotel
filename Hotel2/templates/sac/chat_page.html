<!-- templates/sac/chat_page.html -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Chat SAC / RAG – Hotel Villa Grace</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #f5f5f7;
        }
        header {
            padding: 0.75rem 1rem;
            background: #1e3050;
            color: #fff;
        }
        header h1 {
            margin: 0;
            font-size: 1rem;
        }
        header p {
            margin: 0.1rem 0 0;
            font-size: 0.8rem;
            opacity: 0.8;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 720px;
            margin: 0.75rem auto;
            width: 100%;
            padding: 0 0.75rem;
            box-sizing: border-box;
        }
        .chat-log {
            flex: 1;
            background: #ffffff;
            border-radius: 10px;
            padding: 0.75rem;
            overflow-y: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
        .msg-row {
            margin-bottom: 0.5rem;
            display: flex;
        }
        .msg-row.user {
            justify-content: flex-end;
        }
        .msg-row.bot {
            justify-content: flex-start;
        }
        .msg-bubble {
            max-width: 80%;
            padding: 0.4rem 0.6rem;
            border-radius: 14px;
            font-size: 0.85rem;
            line-height: 1.3;
            white-space: pre-wrap;
        }
        .msg-user {
            background: #2859ab;
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .msg-bot {
            background: #f0f0f5;
            color: #222;
            border-bottom-left-radius: 2px;
        }
        .msg-meta {
            font-size: 0.7rem;
            color: #777;
            margin-top: 0.15rem;
        }
        .input-area {
            margin-top: 0.5rem;
            display: flex;
            gap: 0.4rem;
        }
        textarea {
            flex: 1;
            resize: none;
            min-height: 50px;
            max-height: 120px;
            font-family: inherit;
            font-size: 0.85rem;
            padding: 0.4rem 0.5rem;
            border-radius: 10px;
            border: 1px solid #cfd0d5;
            box-sizing: border-box;
        }
        button {
            border-radius: 999px;
            border: none;
            padding: 0.4rem 0.9rem;
            background: #2859ab;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-end;
            white-space: nowrap;
        }
        button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .status {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.25rem;
            min-height: 1rem;
        }
        .suggestions {
            margin-top: 0.25rem;
            font-size: 0.8rem;
        }
        .suggestions span {
            display: inline-block;
            background: #e5e7f3;
            color: #283053;
            border-radius: 999px;
            padding: 0.15rem 0.5rem;
            margin: 0 0.25rem 0.25rem 0;
            cursor: pointer;
        }
        .msg-row.agent {
            justify-content: flex-start;
        }
        .msg-agent {
            background: #e8f4ea;
            color: #1f5131;
            border-bottom-left-radius: 2px;
        }
        .handoff-box {
            margin-top: 0.5rem;
            background: #fff7e6;
            border: 1px solid #f0d48a;
            border-radius: 10px;
            padding: 0.6rem 0.75rem;
        }
        .handoff-text {
            font-size: 0.85rem;
            margin-bottom: 0.45rem;
            color: #5c4715;
        }
        .handoff-actions {
            display: flex;
            gap: 0.5rem;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .msg-card {
            display: flex;
            flex-direction: column;
            max-width: 84%;
        }

        .msg-row.user .msg-card {
            align-items: flex-end;
            margin-left: auto;
        }

        .msg-author {
            font-size: 0.72rem;
            color: #667085;
            margin-bottom: 0.18rem;
            font-weight: 600;
        }

        .msg-row.user .msg-author {
            text-align: right;
        }

        .msg-meta {
            margin-top: 0.18rem;
        }

        .handoff-box {
            position: sticky;
            bottom: 0;
            z-index: 5;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .handoff-box[hidden] {
            display: none !important;
        }
        .chat-container {
            max-width: 860px;
            height: calc(100vh - 96px);
        }

        .chat-container.expanded {
            position: fixed;
            inset: 16px;
            z-index: 9999;
            max-width: none;
            width: auto;
            height: auto;
            margin: 0;
            padding: 1rem;
            background: #f5f5f7;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .chat-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .chat-toolbar-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1e3050;
        }

        .chat-toolbar-subtitle {
            font-size: 0.78rem;
            color: #6b7280;
        }

        .chat-toolbar-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-ghost {
            background: #eef2f7;
            color: #1e3050;
        }

        .chat-log-wrapper {
            flex: 1;
            min-height: 0;
        }

        .chat-log {
            height: 100%;
        }

        .msg-card {
            display: flex;
            flex-direction: column;
            max-width: 82%;
        }

        .msg-row.user .msg-card {
            align-items: flex-end;
        }

        .msg-author {
            font-size: 0.72rem;
            color: #6b7280;
            margin-bottom: 0.18rem;
            font-weight: 600;
        }

        .msg-row.user .msg-author {
            text-align: right;
        }

        .handoff-box {
            position: sticky;
            bottom: 0;
            z-index: 5;
            margin-top: 0.75rem;
        }

        @media (max-width: 768px) {
            .chat-container,
            .chat-container.expanded {
                inset: 8px;
                padding: 0.75rem;
                height: auto;
            }

            .msg-card {
                max-width: 92%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Chat SAC / RAG – Hotel Villa Grace</h1>
        <p>Prueba del endpoint <code>/sac/ask</code> con base de conocimiento.</p>
    </header>

    <div id="chatShell" class="chat-container">
        <div class="chat-toolbar">
            <div>
                <div class="chat-toolbar-title">Chat Hotel Villa Grace</div>
                <div class="chat-toolbar-subtitle">Bot y atención humana en el mismo hilo</div>
            </div>
            <div class="chat-toolbar-actions">
                <button type="button" id="toggleExpandBtn" class="btn-ghost">Ampliar</button>
            </div>
        </div>

        <div class="chat-log-wrapper">
            <div id="chatLog" class="chat-log"></div>
        </div>

        <div class="suggestions" id="suggestions"></div>

        <div id="handoffBox" class="handoff-box" hidden>
            <div class="handoff-text">
                ¿Desea que transfiera esta conversación a un agente humano de recepción?
            </div>
            <div class="handoff-actions">
                <button type="button" id="handoffYesBtn">Sí</button>
                <button type="button" id="handoffNoBtn" class="btn-secondary">No</button>
            </div>
        </div>

        <div class="input-area">
            <textarea id="inputText" placeholder="Escribe tu consulta sobre el hotel..."></textarea>
            <button id="sendBtn">Enviar</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
    (function() {
        const chatLog = document.getElementById("chatLog");
        const inputText = document.getElementById("inputText");
        const sendBtn = document.getElementById("sendBtn");
        const statusEl = document.getElementById("status");
        const suggEl = document.getElementById("suggestions");
        const handoffBox = document.getElementById("handoffBox");
        const handoffYesBtn = document.getElementById("handoffYesBtn");
        const handoffNoBtn = document.getElementById("handoffNoBtn");
    
        const seenIds = new Set();
        let lastMessageId = 0;
        let syncInFlight = false;
    
        function getSessionId() {
            const key = "vg_sac_sid";
            let sid = localStorage.getItem(key);
            if (!sid) {
                sid = "web-" + Math.random().toString(36).slice(2);
                localStorage.setItem(key, sid);
            }
            return sid;
        }
    
        function normalizeRole(role) {
            const r = (role || "").toLowerCase();
            if (r === "user") return "user";
            if (r === "agent") return "agent";
            return "bot";
        }
    
        function defaultSenderName(role, senderName) {
            if (senderName) return senderName;
            const r = normalizeRole(role);
            if (r === "user") return "Cliente";
            if (r === "agent") return "Asesor Hotel Villa Grace";
            return "Bot Hotel Villa Grace";
        }
    
        function showHandoffBox(show) {
            handoffBox.hidden = !show;
        }
    
        function appendMessage(text, role, senderName, createdAt, messageId) {
            if (messageId && seenIds.has(String(messageId))) return;
            if (messageId) seenIds.add(String(messageId));
    
            const who = normalizeRole(role);
    
            const row = document.createElement("div");
            row.className = "msg-row " + who;
    
            const card = document.createElement("div");
            card.className = "msg-card";
    
            const author = document.createElement("div");
            author.className = "msg-author";
            author.textContent = defaultSenderName(who, senderName);
    
            const bubble = document.createElement("div");
            bubble.className = "msg-bubble " + (
                who === "user" ? "msg-user" :
                who === "agent" ? "msg-agent" :
                "msg-bot"
            );
            bubble.textContent = text || "";
    
            card.appendChild(author);
            card.appendChild(bubble);
    
            if (createdAt) {
                const meta = document.createElement("div");
                meta.className = "msg-meta";
                meta.textContent = createdAt;
                card.appendChild(meta);
            }
    
            row.appendChild(card);
            chatLog.appendChild(row);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    
        function renderSuggestions(list) {
            suggEl.innerHTML = "";
            if (!Array.isArray(list) || !list.length) return;
    
            list.forEach((s) => {
                const span = document.createElement("span");
                span.textContent = s;
                span.addEventListener("click", () => {
                    inputText.value = s;
                    inputText.focus();
                });
                suggEl.appendChild(span);
            });
        }
    
        async function syncHistory() {
            if (syncInFlight) return;
            syncInFlight = true;
    
            try {
                const sid = getSessionId();
                const qs = new URLSearchParams({ session_id: sid });
                if (lastMessageId > 0) {
                    qs.set("since_id", String(lastMessageId));
                }
    
                const resp = await fetch(`/sac/chat/history?${qs.toString()}`, {
                    cache: "no-store"
                });
    
                const js = await resp.json();
                if (!js.ok) return;
    
                const msgs = js.messages || [];
                msgs.forEach((m) => {
                    appendMessage(
                        m.text || "",
                        m.role || "bot",
                        m.sender_name || "",
                        m.created_at || "",
                        m.id
                    );
    
                    if (m.id && Number(m.id) > lastMessageId) {
                        lastMessageId = Number(m.id);
                    }
                });
    
                const handoffState = (js.handoff_state || "").toUpperCase();
                const status = (js.status || "").toLowerCase();
    
                if (handoffState === "OFFER" || js.show_handoff_offer === true || status === "handoff_offer") {
                    showHandoffBox(true);
                    statusEl.textContent = "Tienes una solicitud pendiente para decidir si deseas ser atendido por un asesor.";
                } else if (handoffState === "PENDING" || status === "agent_pending") {
                    showHandoffBox(false);
                    statusEl.textContent = "Tu conversación fue transferida a recepción.";
                } else if (status === "agent_active") {
                    showHandoffBox(false);
                    statusEl.textContent = "Tu conversación está siendo atendida por un asesor.";
                } else if (status === "bot") {
                    if (!handoffBox.hidden) {
                        showHandoffBox(false);
                    }
                }
            } catch (err) {
                console.error(err);
            } finally {
                syncInFlight = false;
            }
        }
    
        async function sendMessage() {
            const q = (inputText.value || "").trim();
            if (!q) return;
    
            statusEl.textContent = "Consultando...";
            sendBtn.disabled = true;
    
            try {
                const sid = getSessionId();
    
                const resp = await fetch("{{ url_for('sac.sac_ask') }}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Session-Id": sid
                    },
                    body: JSON.stringify({ q: q })
                });
    
                const js = await resp.json();
                sendBtn.disabled = false;
    
                if (!js.ok) {
                    statusEl.textContent = "Error: " + (js.error || "No se pudo obtener respuesta.");
                    return;
                }
    
                inputText.value = "";
                renderSuggestions(js.suggestions || js.sugs || []);
    
                if ((js.handoff_state || "").toUpperCase() === "OFFER") {
                    showHandoffBox(true);
                }
    
                await syncHistory();
    
                const conf = typeof js.confidence === "number" ? js.confidence : null;
                const source = js.source || "";
                let metaMsg = "";
    
                if (conf !== null) {
                    metaMsg += "Confianza aprox: " + (conf * 100).toFixed(0) + "%";
                }
                if (source) {
                    if (metaMsg) metaMsg += " · ";
                    metaMsg += "Fuente: " + source;
                }
    
                if (metaMsg) {
                    statusEl.textContent = metaMsg;
                }
            } catch (err) {
                sendBtn.disabled = false;
                statusEl.textContent = "Error de red: " + err;
            }
        }
    
        async function resolveHandoff(decision) {
            handoffYesBtn.disabled = true;
            handoffNoBtn.disabled = true;
    
            try {
                const sid = getSessionId();
    
                const resp = await fetch("/sac/chat/handoff-decision", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Session-Id": sid
                    },
                    body: JSON.stringify({
                        session_id: sid,
                        decision: decision
                    })
                });
    
                const js = await resp.json();
    
                if (!js.ok) {
                    statusEl.textContent = "No se pudo procesar la decisión.";
                    return;
                }
    
                showHandoffBox(false);
                await syncHistory();
    
                if (decision === "accept") {
                    statusEl.textContent = "Tu conversación fue transferida a recepción.";
                } else {
                    statusEl.textContent = "Continuamos por el chat con el asistente.";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error de red al procesar la decisión.";
            } finally {
                handoffYesBtn.disabled = false;
                handoffNoBtn.disabled = false;
            }
        }
    
        sendBtn.addEventListener("click", sendMessage);
    
        inputText.addEventListener("keydown", (e) => {
            if ((e.key === "Enter" || e.keyCode === 13) && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    
        handoffYesBtn.addEventListener("click", () => resolveHandoff("accept"));
        handoffNoBtn.addEventListener("click", () => resolveHandoff("reject"));
    
        syncHistory().then(() => {
            if (!chatLog.children.length) {
                appendMessage(
                    "Hola, soy el asistente del Hotel Villa Grace. ¿En qué puedo ayudarle?",
                    "bot",
                    "Bot Hotel Villa Grace",
                    "",
                    "local-welcome"
                );
            }
        });
    
        setInterval(syncHistory, 2500);
    })();
    </script>
</body>
</html>
