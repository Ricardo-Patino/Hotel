<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva confirmada | Hotel Villa Grace</title>
  <meta name="description" content="Confirmación de reserva con número y detalles.">

  <!-- Favicons -->
  <link href="{{ url_for('static', filename='assets/img/favicon.png') }}" rel="icon">
  <link href="{{ url_for('static', filename='assets/img/apple-touch-icon.png') }}" rel="apple-touch-icon">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Vendors -->
  <link href="{{ url_for('static', filename='assets/vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='assets/vendor/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='assets/vendor/aos/aos.css') }}" rel="stylesheet">

  <!-- Estilos -->
  <link href="{{ url_for('static', filename='assets/css/main.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='assets/css/style.css') }}" rel="stylesheet">

  <style>
    .conf-check{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#e8f5ef;color:#1b7a4a}
    .conf-row{border-bottom:1px solid rgba(0,0,0,.06);padding:.6rem 0}
    .conf-row span:first-child{color:#5f6b77}
    .mini{font-size:.875rem;color:#6c757d}
    @media print{.no-print{display:none!important}}
  </style>
</head>
<body class="privacy-page">
  <header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container position-relative d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
        <h1 class="sitename">Hotel Villa Grace</h1>
      </a>
      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="booking-search.html">Reservar</a></li>
          <li><a href="portal-dashboard.html">Portal</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>
      <a class="btn-getstarted d-none d-sm-block no-print" href="portal-reservas.html">Mis reservas</a>
    </div>
  </header>

  <main class="main">
    <div class="page-title dark-background" data-aos="fade" style="background-image:url({{ url_for('static', filename='assets/img/hotel/showcase-7.webp') }});">
      <div class="container position-relative">
        <h1>¡Reserva confirmada!</h1>
        <p>Gracias por reservar directamente con nosotros.</p>
      </div>
    </div>

    <section class="section">
      <div class="container" data-aos="fade-up" id="content">
        <!-- Rellenado por JS -->
      </div>
    </section>
  </main>

  <footer id="footer" class="footer position-relative dark-background">
    <div class="copyright text-center">
      <div class="container">© <strong><span>Hotel Villa Grace</span></strong> · Cóbano, Puntarenas</div>
    </div>
  </footer>

  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
  </a>
  <div id="preloader"></div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='assets/vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/vendor/aos/aos.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/js/main.js') }}"></script>

  <script>
    // ---------- Utilidades ----------
    const TAX_RATE = 0.13;

    function moneyCRC(n){
      return new Intl.NumberFormat('es-CR',{style:'currency',currency:'CRC',minimumFractionDigits:2}).format(Number(n||0));
    }
    function fmtLong(iso){
      try{
        const d = new Date(String(iso)+'T00:00:00');
        return new Intl.DateTimeFormat('es-CR',{day:'2-digit',month:'short',year:'numeric'}).format(d).replace('.','');
      }catch(_){ return String(iso||''); }
    }
    function nightsDiff(a,b){
      if(!(a&&b)) return 1;
      const d1 = new Date(a+'T00:00:00'), d2 = new Date(b+'T00:00:00');
      return Math.max(1, Math.round((d2-d1)/86400000));
    }
    function readConfirm(){
      let raw = sessionStorage.getItem('villaGrace.confirm');
      if(!raw) raw = sessionStorage.getItem('villaGrace.confirmation');
      try{ return JSON.parse(raw || 'null'); }catch(_){ return null; }
    }
    function safeInt(v, def=0){ const n = parseInt(v,10); return Number.isFinite(n)? n : def; }
    function safeNum(v, def=0){ const n = Number(v); return Number.isFinite(n)? n : def; }

    // ---------- Preferir total del backend si existe ----------
    async function fetchReservaTotals(reservaId){
      const paths = [
        `/api/reservas/${reservaId}`,
        `/grr/reservas/${reservaId}`,
        `/api/portal/reservas/${reservaId}`
      ];
      for (const url of paths){
        try{
          const r = await fetch(url,{headers:{Accept:'application/json'}});
          if(!r.ok) continue;
          const j = await r.json();
          // Intentar mapear nombres comunes
          const total = j.Monto_Total ?? j.total ?? j.Total ?? j.Monto ?? j.monto ?? null;
          const subtotal = j.Subtotal ?? j.subtotal ?? null;
          const impuesto = j.Impuesto ?? j.impuesto ?? j.Tax ?? j.tax ?? null;
          if(total || subtotal){
            return {
              backend: true,
              subtotal: safeNum(subtotal ?? (total && impuesto ? (total - impuesto) : null)),
              tax: safeNum(impuesto ?? (subtotal ? subtotal*TAX_RATE : null)),
              total: safeNum(total ?? (subtotal ? subtotal*(1+TAX_RATE) : null))
            };
          }
        }catch(_){ /* siguiente intento */ }
      }
      return null;
    }

    // ---------- Recalcular total localmente si hace falta ----------
    function computeLocalTotals(data){
      // priceNight = precio por HUESPED por NOCHE (viene de booking-details/checkout)
      const pricePerGuestNight = safeNum(data.priceNight, 0);
      // huéspedes
      const adults = safeInt(data?.guests?.adults ?? data.adults ?? 1, 1);
      const children = safeInt(data?.guests?.children ?? data.children ?? 0, 0);
      const guests = Math.max(1, adults + children);
      // noches
      const ini = (data.dates && data.dates.ini) || data.checkin || '';
      const fin = (data.dates && data.dates.fin) || data.checkout || '';
      const nights = safeInt(data?.dates?.nights ?? data.nights ?? nightsDiff(ini,fin), 1);

      const perNightAll = pricePerGuestNight * guests;
      const subtotal = perNightAll * nights;
      const tax = subtotal * TAX_RATE;
      const total = subtotal + tax;

      return { guests, nights, perNightAll, pricePerGuestNight, subtotal, tax, total, ini, fin };
    }

    async function findReservaIdByNumero(numero){
      try{
        const r = await fetch(`/api/portal/reservas?estado=Confirmada`, {headers:{Accept:'application/json'}});
        const j = await r.json();
        if(!j || !j.ok || !Array.isArray(j.items)) return null;
        const hit = j.items.find(x => String((x.numero||'')).trim() === String(numero).trim());
        return hit ? hit.id : null;
      }catch(_){ return null; }
    }

    async function renderConfirmation(){
      const box = document.getElementById('content');
      const data = readConfirm();

      if(!data){
        box.innerHTML = `
          <div class="alert alert-warning">
            No encontramos los datos de la reserva en este dispositivo.
            <a href="booking-search.html" class="alert-link">Inicia una nueva búsqueda</a>.
          </div>`;
        return;
      }

      const code   = data.numero || data.code || 'VG-PENDIENTE';
      const name   = data.name || '—';
      const room   = data.roomName || (data.habitacion && (data.habitacion.Nombre || data.habitacion.Numero_Habitacion)) || '—';

      // Cálculo local
      const local = computeLocalTotals(data);

      // Si tenemos id, traer total oficial
      let reservaId = data.reservaId || null;
      if(!reservaId && code && code !== 'VG-PENDIENTE'){
        reservaId = await findReservaIdByNumero(code);
      }

      let official = null;
      if(reservaId){ official = await fetchReservaTotals(reservaId); }

      // Decidir total a mostrar:
      // 1) Si hay total oficial del backend, úsalo.
      // 2) Si no, y data.total existe pero difiere >5% del cálculo local, preferimos el cálculo local.
      // 3) Si no, usamos data.total.
      const savedTotal = safeNum(data.total, 0);
      const calcTotal = local.total;
      let showTotal = calcTotal;
      let used = 'calc';
      if(official && official.total){
        showTotal = official.total;
        used = 'backend';
      }else if(savedTotal > 0){
        const delta = Math.abs(savedTotal - calcTotal) / Math.max(savedTotal, calcTotal);
        if(delta <= 0.05){ showTotal = savedTotal; used = 'saved'; }
        else { showTotal = calcTotal; used = 'calc'; }
      }

      const datesTxt = (local.ini && local.fin) ? `${fmtLong(local.ini)} – ${fmtLong(local.fin)}` : '—';
      const guestsTxt = `${(data.guests?.adults ?? data.adults ?? 1)} adulto(s)` +
                        (safeInt(data.guests?.children ?? data.children ?? 0) ? ` · ${data.guests?.children ?? data.children} niño(s)` : '');
      const plan   = data.plan || data.rateName || 'Tarifa Flexible';
      const hasComprobante = !!reservaId;

      // Nota de transparencia si el total mostrado viene del backend y difiere del cálculo local
      let note = '';
      if(official && official.total){
        const delta = Math.abs(official.total - calcTotal);
        if(delta > 50){ // umbral pequeño para evitar ruido por redondeos
          note = `<div class="mini mt-2"><i class="bi bi-info-circle me-1"></i>
                    El total proviene del sistema (<strong>oficial</strong>). Nuestro cálculo estimado fue ${moneyCRC(calcTotal)}.
                  </div>`;
        }
      }

      box.innerHTML = `
        <div class="card shadow-sm border-0">
          <div class="card-body text-center">
            <div class="conf-check mb-3"><i class="bi bi-check-lg fs-3"></i></div>
            <h3 class="mb-1">Código de reserva: <span class="fw-bold">${code}</span></h3>
            <p class="text-muted">Tu reserva ha sido creada correctamente.</p>

            <div class="row justify-content-center text-start mt-3">
              <div class="col-md-8 col-lg-6">
                <div class="conf-row d-flex justify-content-between"><span>Nombre</span><span>${name}</span></div>
                <div class="conf-row d-flex justify-content-between"><span>Habitación</span><span>${room}</span></div>
                <div class="conf-row d-flex justify-content-between"><span>Fechas</span><span>${datesTxt}</span></div>
                <div class="conf-row d-flex justify-content-between"><span>Noches</span><span>${local.nights}</span></div>
                <div class="conf-row d-flex justify-content-between"><span>Huéspedes</span><span>${guestsTxt}</span></div>
                <div class="conf-row d-flex justify-content-between"><span>Plan</span><span>${plan}</span></div>

                <div class="mt-3 mini">
                  Detalle de cálculo: ${local.nights} × ${moneyCRC(local.pricePerGuestNight)} <em>(por huésped)</em> × ${local.guests} = ${moneyCRC(local.subtotal)} <span class="text-muted">(subtotal)</span><br>
                  Impuesto (13%): ${moneyCRC(local.tax)}
                </div>

                <div class="d-flex justify-content-between align-items-center mt-2">
                  <h4 class="mb-0">Total</h4>
                  <h4 class="mb-0">${moneyCRC(showTotal)}</h4>
                </div>
                ${note}
                <div class="mini mt-2">Los importes incluyen impuestos y pueden variar por normativa local.</div>

                <div class="d-grid d-md-flex gap-2 justify-content-center mt-4 no-print">
                  <a class="btn btn-primary ${reservaId ? '' : 'disabled'}"
                     ${reservaId ? `href="portal-reserva-detalle.html?id=${encodeURIComponent(reservaId)}"` : 'href="portal-reservas.html" aria-disabled="true"'}
                  >
                    <i class="bi bi-person-badge me-1"></i> Ver detalle en Portal
                  </a>
                  
                  <button class="btn btn-outline" onclick="window.print()">
                    <i class="bi bi-printer me-1"></i> Imprimir/Guardar PDF
                  </button>
                  <a class="btn btn-outline-secondary" href="index.html">
                    <i class="bi bi-house me-1"></i> Inicio
                  </a>
                  <a class="btn btn-success ${hasComprobante?'':'disabled'}" id="btn-pdf" target="_blank"
                     ${hasComprobante?`href="/api/reservas/${reservaId}/comprobante"`:''}>
                    <i class="bi bi-filetype-pdf me-1"></i> Descargar comprobante
                  </a>
                </div>

                <div class="text-muted small mt-3">
                  ¿No recibiste el correo? Revisa spam o escríbenos a
                  <a href="mailto:hotelvillagrace@gmail.com">hotelvillagrace@gmail.com</a>.
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    renderConfirmation();
  </script>
</body>
</html>
