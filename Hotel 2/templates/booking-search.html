  <!-- Fuentes -->

  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <link href="{{ url_for('static', filename='assets/vendor/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet">

<body class="privacy-page">
  <!-- Header -->
  <header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container position-relative d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
        <h1 class="sitename">Hotel Villa Grace</h1>
      </a>
      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="rooms.html">Habitaciones</a></li>
          <li><a href="booking-search.html" class="active">Reservar</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>
      <a class="btn-getstarted d-none d-sm-block" href="portal-dashboard.html">Portal Huésped</a>
    </div>
  </header>

  <main class="main">
    <!-- Título -->
    <div class="page-title dark-background" data-aos="fade"
         style="background-image:url({{ url_for('static', filename='assets/img/hotel/showcase-7.webp') }});">
      <div class="container position-relative">
        <h1>Reserva tu estadía</h1>
        <p>Elige fechas y huéspedes para ver disponibilidad y tarifas.</p>
        <nav class="breadcrumbs">
          <ol>
            <li><a href="index.html">Inicio</a></li>
            <li class="current">Reservas</li>
          </ol>
        </nav>
      </div>
    </div>

    <!-- Buscador -->
    <section class="section">
      <div class="container" data-aos="fade-up">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <form id="search-form" class="row g-3 align-items-end" action="booking-results.html" method="get" novalidate>
              <div class="col-12 col-md-3">
                <label class="form-label" for="checkin">Check-in</label>
                <input type="date" class="form-control" id="checkin" name="checkin" required>
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label" for="checkout">Check-out</label>
                <input type="date" class="form-control" id="checkout" name="checkout" required>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label" for="adults">Adultos</label>
                <select class="form-select" id="adults" name="adults">
                  <option>1</option><option selected>2</option><option>3</option><option>4</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label" for="children">Niños</label>
                <select class="form-select" id="children" name="children">
                  <option selected>0</option><option>1</option><option>2</option><option>3</option>
                </select>
              </div>
              <div class="col-12 col-md-2 d-grid">
                <button id="btn-search" type="submit" class="btn btn-success">
                  <i class="bi bi-search me-1"></i> Buscar
                </button>
              </div>

              <div class="col-12">
                <div id="alert-error" class="alert alert-danger d-none"></div>
              </div>
            </form>
          </div>
        </div>

        <p class="text-muted small mt-3">
          <i class="bi bi-info-circle me-1"></i> Mejor tarifa garantizada al reservar directo.
        </p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="footer" class="footer position-relative dark-background">
    <div class="copyright text-center">
      <div class="container">© <strong><span>Hotel Villa Grace</span></strong> · Cóbano, Puntarenas</div>
    </div>
  </footer>

  <!-- Utilidades -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i></a>
  <div id="preloader"></div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='assets/vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/vendor/aos/aos.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/vendor/purecounter/purecounter_vanilla.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/vendor/swiper/swiper-bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/vendor/glightbox/js/glightbox.min.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/vendor/drift-zoom/Drift.min.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/vendor/imagesloaded/imagesloaded.pkgd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/vendor/isotope-layout/isotope.pkgd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/js/main.js') }}"></script>

  <!-- Lógica del buscador -->
  <script>
    (function () {
      const $ = (s) => document.querySelector(s);
      const form = $('#search-form');
      const $in  = $('#checkin');
      const $out = $('#checkout');
      const $err = $('#alert-error');

      function todayISO(d=0) {
        const t = new Date();
        t.setDate(t.getDate() + d);
        const m = (t.getMonth()+1).toString().padStart(2,'0');
        const day = t.getDate().toString().padStart(2,'0');
        return `${t.getFullYear()}-${m}-${day}`;
      }

      // Defaults y límites
      function setDefaults() {
        const today = todayISO(0);
        const tomorrow = todayISO(1);
        $in.min  = today;
        $out.min = tomorrow;

        if (!$in.value)  $in.value  = today;
        if (!$out.value) $out.value = tomorrow;
      }

      function showError(msg) {
        $err.textContent = msg || 'Revisa los campos.';
        $err.classList.remove('d-none');
      }
      function hideError() {
        $err.classList.add('d-none');
      }

      function validDates() {
        const ci = new Date($in.value);
        const co = new Date($out.value);
        if (!($in.value && $out.value)) return false;
        return co > ci;
      }

      // Ajuste automático: si el usuario cambia check-in y deja inválido el check-out
      $in.addEventListener('change', () => {
        const ci = new Date($in.value);
        const co = new Date($out.value);
        const next = new Date(ci); next.setDate(ci.getDate()+1);
        const nextISO = next.toISOString().slice(0,10);
        $out.min = nextISO;
        if (!($out.value) || co <= ci) $out.value = nextISO;
      });

      form.addEventListener('submit', (e) => {
        hideError();
        if (!validDates()) {
          e.preventDefault();
          showError('La fecha de salida debe ser posterior a la de llegada.');
          return;
        }

        // Guardamos la búsqueda para que booking-results.html la use si quiere
        const params = {
          checkin:  $in.value,
          checkout: $out.value,
          adults:   document.getElementById('adults').value,
          children: document.getElementById('children').value
        };
        try {
          sessionStorage.setItem('villaGrace.search', JSON.stringify(params));
        } catch(_) {}

        // Deja que el formulario continúe hacia booking-results.html con GET
        // (ya lleva action="booking-results.html" method="get")
      });

      setDefaults();
    })();
  </script>
</body>
</html>
