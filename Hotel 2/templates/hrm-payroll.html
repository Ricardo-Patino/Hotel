{% set title = "Nómina | Hotel Villa Grace" %} <!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ title }}</title>
    <link
      href="{{ url_for('static', filename='assets/vendor/bootstrap/css/bootstrap.min.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='assets/vendor/bootstrap-icons/bootstrap-icons.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='assets/css/style.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="header" class="header fixed-top">
      <div class="container d-flex align-items-center justify-content-between">
        <a href="/" class="logo d-flex align-items-center me-auto me-xl-0"
          ><h1 class="sitename">Hotel Villa Grace</h1></a
        >
      </div>
    </header>

    <main class="main" style="margin-top: 90px">
      <div class="container">
        <h2 class="mb-3" style="color: #4b49ac">Nómina quincenal</h2>

        <div class="card p-3 mb-4">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label">Periodo (YYYY-MM)</label
              ><input id="pk" class="form-control" placeholder="2025-11" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Quincena</label>
              <select id="q" class="form-select">
                <option>Q1</option>
                <option>Q2</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Desde</label
              ><input id="d" type="date" class="form-control" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Hasta</label
              ><input id="h" type="date" class="form-control" />
            </div>
            <div class="col-md-1 text-end">
              <button id="btnNew" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5>Periodos existentes</h5>
          <button id="btnCalc" class="btn btn-success">
            <i class="bi bi-calculator"></i> Calcular nómina
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm" id="tb">
            <thead>
              <tr>
                <th>Id</th>
                <th>Periodo</th>
                <th>Q</th>
                <th>Desde</th>
                <th>Hasta</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              {% for p in periods %}
              <tr data-id="{{p.Id}}">
                <td>{{p.Id}}</td>
                <td>{{p.Periodo_Key}}</td>
                <td>{{p.Quincena}}</td>
                <td>{{p.Fecha_Desde}}</td>
                <td>{{p.Fecha_Hasta}}</td>
                <td>{{p.Estado}}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      let selectedId = null;
      document.querySelectorAll("#tb tbody tr").forEach((tr) => {
        tr.onclick = () => {
          document
            .querySelectorAll("#tb tbody tr")
            .forEach((r) => r.classList.remove("table-active"));
          tr.classList.add("table-active");
          selectedId = tr.dataset.id;
        };
      });
      document.getElementById("btnNew").onclick = async () => {
        const body = {
          periodo_key: document.getElementById("pk").value,
          quincena: document.getElementById("q").value,
          desde: document.getElementById("d").value,
          hasta: document.getElementById("h").value,
        };
        await fetch('{{ url_for("hrm.create_period") }}', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        location.reload();
      };
      document.getElementById("btnCalc").onclick = async () => {
        if (!selectedId) {
          alert("Seleccione un periodo");
          return;
        }
        await fetch('{{ url_for("hrm.payroll_generate") }}', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ period_id: parseInt(selectedId) }),
        });
        alert("Nómina calculada");
      };
    </script>
  </body>
</html>
